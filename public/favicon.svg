<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="od-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <linearGradient id="od-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" rx="220" ry="220" fill="url(#od-bg)" stroke="#ea580c" stroke-width="20" />
  <g transform="translate(100, 100) scale(20)" fill="none">
    <!-- 'O' loop on the left -->
    <path
      d="M20 34C12.5 34 7 28.5 7 21C7 13.5 12.5 8 20 8C21.8 8 23.5 8.4 25 9.1"
      stroke="url(#od-orange)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <!-- 'D' loop on the right -->
    <path
      d="M20 16C27 16 33 21 33 27C33 33 27 36 20 36"
      stroke="url(#od-orange)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <!-- Center pencil shaft & tip -->
    <path
      d="M20 36V10"
      stroke="url(#od-orange)"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <polygon
      points="17.5,10 20,4 22.5,10"
      fill="#ea580c"
    />
    <polygon
      points="19,6.5 20,4 21,6.5"
      fill="#c2410c"
    />
  </g>
</svg>
